[project]
name = "concierge"
version = "0.1.0"
description = "HeyJarvis Concierge: turns patient booking requests into front-desk email drafts (Raleigh Dental v1)"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.0",
    "groq>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
concierge = "concierge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concierge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
